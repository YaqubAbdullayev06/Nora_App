# PocketBase Docker Compose — for local dev or any VPS
# Free on: Oracle Cloud, Render, Fly.io, Railway (free tier)

version: "3.8"

services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:0.22.0
    container_name: pocketbase
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./data/pb_data:/pb/pb_data
      - ./data/pb_migrations:/pb/pb_migrations
    environment:
      - PB_HOOKS_DIR=/pb/pb_hooks
      # Admin credentials (change these!)
      - PB_ADMIN_EMAIL=nora@example.com
      - PB_ADMIN_PASSWORD=CHANGE_ME_NOW
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# Usage:
#   docker compose up -d
#   Open http://localhost:8090/_/
#   Create admin account on first visit
