name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flutter-test:
    name: Flutter Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NoraApp
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # C5: `--no-fatal-infos` does not exist (--fatal-infos is non-negatable),
      # so this step exited 64 with "Cannot negate option" on every run and
      # `flutter test` below never executed. Infos are non-fatal by default.
      # Scope to lib/test: `dart analyze` with no path would also walk the
      # vendored SDK in NoraApp/flutter/.
      - name: Analyze
        run: dart analyze lib test

      - name: Run tests
        run: flutter test

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NoraApp/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run tests
        env:
          SECRET_KEY: ci-test-secret-key-do-not-use-in-production
          DATABASE_URL: "sqlite:///./test_nora.db"
        # Run the whole backend suite: `pytest tests/` silently skipped the
        # 25 tests living at backend/ root (test_app_classifier.py,
        # test_blocking_rules.py) — they passed locally but never in CI.
        run: pytest -v
