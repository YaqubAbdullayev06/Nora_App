<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Background glow -->
  <circle cx="60" cy="60" r="55" fill="url(#glow_good)" opacity="0.25"/>
  <!-- Main face circle -->
  <circle cx="60" cy="60" r="45" fill="url(#face_good)"/>
  <!-- Shine highlight -->
  <ellipse cx="45" cy="42" rx="12" ry="8" fill="white" opacity="0.2" transform="rotate(-15 45 42)"/>
  <!-- Left eye -->
  <ellipse cx="42" cy="52" rx="5.5" ry="6.5" fill="#1a1a2e"/>
  <circle cx="40.5" cy="50.5" r="2" fill="white"/>
  <!-- Right eye -->
  <ellipse cx="78" cy="52" rx="5.5" ry="6.5" fill="#1a1a2e"/>
  <circle cx="76.5" cy="50.5" r="2" fill="white"/>
  <!-- Happy smile -->
  <path d="M42 72 Q60 86 78 72" stroke="#1a1a2e" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- Blush circles -->
  <circle cx="32" cy="64" r="7" fill="#ffaaaa" opacity="0.35"/>
  <circle cx="88" cy="64" r="7" fill="#ffaaaa" opacity="0.35"/>
  <!-- Small sparkle -->
  <circle cx="95" cy="28" r="3" fill="#7dd3fc" opacity="0.6"/>
  <circle cx="18" cy="35" r="2" fill="#7dd3fc" opacity="0.5"/>
  <defs>
    <radialGradient id="glow_good" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="face_good" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
</svg>