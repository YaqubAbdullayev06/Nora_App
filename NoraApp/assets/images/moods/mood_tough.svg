<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Background glow -->
  <circle cx="60" cy="60" r="55" fill="url(#glow_tough)" opacity="0.2"/>
  <!-- Main face circle -->
  <circle cx="60" cy="60" r="45" fill="url(#face_tough)"/>
  <!-- Shine highlight -->
  <ellipse cx="45" cy="42" rx="11" ry="7" fill="white" opacity="0.15" transform="rotate(-15 45 42)"/>
  <!-- Left eye -->
  <ellipse cx="42" cy="54" rx="5" ry="5.5" fill="#1a1a2e"/>
  <circle cx="41" cy="53" r="1.8" fill="white"/>
  <!-- Right eye -->
  <ellipse cx="78" cy="54" rx="5" ry="5.5" fill="#1a1a2e"/>
  <circle cx="77" cy="53" r="1.8" fill="white"/>
  <!-- Worried eyebrows -->
  <path d="M32 42 Q42 46 52 42" stroke="#1a1a2e" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M68 42 Q78 46 88 42" stroke="#1a1a2e" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Slight frown -->
  <path d="M44 78 Q60 72 76 78" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Tear drop -->
  <path d="M85 56 Q87 62 85 66 Q83 62 85 56" fill="#93c5fd" opacity="0.5"/>
  <!-- Small rain dots -->
  <circle cx="25" cy="25" r="1.5" fill="#93c5fd" opacity="0.3"/>
  <circle cx="95" cy="30" r="1" fill="#93c5fd" opacity="0.25"/>
  <defs>
    <radialGradient id="glow_tough" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="face_tough" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#7ba4d4"/>
    </linearGradient>
  </defs>
</svg>