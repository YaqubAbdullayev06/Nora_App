<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Background glow -->
  <circle cx="60" cy="60" r="55" fill="url(#glow_rough)" opacity="0.2"/>
  <!-- Main face circle -->
  <circle cx="60" cy="60" r="45" fill="url(#face_rough)"/>
  <!-- Shine highlight -->
  <ellipse cx="45" cy="42" rx="10" ry="6" fill="white" opacity="0.12" transform="rotate(-15 45 42)"/>
  <!-- Left eye (squinting/sad) -->
  <path d="M34 54 Q42 48 50 54" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Right eye (squinting/sad) -->
  <path d="M70 54 Q78 48 86 54" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Sad eyebrows -->
  <path d="M30 44 Q42 50 54 44" stroke="#1a1a2e" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M66 44 Q78 50 90 44" stroke="#1a1a2e" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Frown -->
  <path d="M42 82 Q60 72 78 82" stroke="#1a1a2e" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- Tears -->
  <path d="M38 56 Q40 64 38 70 Q36 64 38 56" fill="#93c5fd" opacity="0.5"/>
  <path d="M82 56 Q84 64 82 70 Q80 64 82 56" fill="#93c5fd" opacity="0.5"/>
  <!-- Rain drops -->
  <circle cx="20" cy="22" r="2" fill="#93c5fd" opacity="0.3"/>
  <circle cx="100" cy="28" r="1.5" fill="#93c5fd" opacity="0.25"/>
  <circle cx="15" cy="45" r="1" fill="#93c5fd" opacity="0.2"/>
  <defs>
    <radialGradient id="glow_rough" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="face_rough" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#6b8db5"/>
    </linearGradient>
  </defs>
</svg>