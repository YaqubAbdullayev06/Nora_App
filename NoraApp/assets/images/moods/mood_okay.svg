<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Background glow -->
  <circle cx="60" cy="60" r="55" fill="url(#glow_okay)" opacity="0.2"/>
  <!-- Main face circle -->
  <circle cx="60" cy="60" r="45" fill="url(#face_okay)"/>
  <!-- Shine highlight -->
  <ellipse cx="45" cy="42" rx="11" ry="7" fill="white" opacity="0.18" transform="rotate(-15 45 42)"/>
  <!-- Left eye -->
  <ellipse cx="42" cy="52" rx="5" ry="6" fill="#1a1a2e"/>
  <circle cx="41" cy="50.5" r="1.8" fill="white"/>
  <!-- Right eye -->
  <ellipse cx="78" cy="52" rx="5" ry="6" fill="#1a1a2e"/>
  <circle cx="77" cy="50.5" r="1.8" fill="white"/>
  <!-- Neutral straight mouth -->
  <line x1="45" y1="74" x2="75" y2="74" stroke="#1a1a2e" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Slight eyebrow raise -->
  <path d="M34 40 Q42 36 50 40" stroke="#1a1a2e" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M70 40 Q78 36 86 40" stroke="#1a1a2e" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>
  <!-- Subtle dots -->
  <circle cx="20" cy="30" r="2" fill="#c4b5fd" opacity="0.4"/>
  <circle cx="100" cy="40" r="1.5" fill="#c4b5fd" opacity="0.3"/>
  <defs>
    <radialGradient id="glow_okay" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="face_okay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
</svg>