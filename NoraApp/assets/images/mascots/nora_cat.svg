<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#FCE7F3"/>
  <!-- Body -->
  <ellipse cx="100" cy="110" rx="45" ry="48" fill="#FFF"/>
  <!-- Head -->
  <circle cx="100" cy="80" r="40" fill="#FFF"/>
  <!-- Ears -->
  <polygon points="65,55 55,25 80,50" fill="#FFF"/>
  <polygon points="135,55 145,25 120,50" fill="#FFF"/>
  <polygon points="67,52 60,30 78,50" fill="#FCE7F3"/>
  <polygon points="133,52 140,30 122,50" fill="#FCE7F3"/>
  <!-- Eyes -->
  <ellipse cx="82" cy="78" rx="8" ry="9" fill="#1E293B"/>
  <ellipse cx="118" cy="78" rx="8" ry="9" fill="#1E293B"/>
  <circle cx="85" cy="75" r="3" fill="#FFF"/>
  <circle cx="121" cy="75" r="3" fill="#FFF"/>
  <!-- Nose -->
  <polygon points="97,90 100,95 103,90" fill="#F9A8D4"/>
  <!-- Mouth -->
  <path d="M100 95 L92 102" stroke="#1E293B" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M100 95 L108 102" stroke="#1E293B" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Whiskers -->
  <line x1="50" y1="85" x2="75" y2="90" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round"/>
  <line x1="48" y1="95" x2="74" y2="95" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="105" x2="75" y2="100" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round"/>
  <line x1="150" y1="85" x2="125" y2="90" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round"/>
  <line x1="152" y1="95" x2="126" y2="95" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round"/>
  <line x1="150" y1="105" x2="125" y2="100" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round"/>
  <!-- Blush -->
  <circle cx="68" cy="92" r="8" fill="#F9A8D4" opacity="0.4"/>
  <circle cx="132" cy="92" r="8" fill="#F9A8D4" opacity="0.4"/>
  <!-- Tail -->
  <path d="M145 130 Q170 110 160 85 Q155 75 160 65" stroke="#FFF" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- Paws -->
  <ellipse cx="75" cy="150" rx="12" ry="8" fill="#FFF"/>
  <ellipse cx="125" cy="150" rx="12" ry="8" fill="#FFF"/>
  <!-- Sparkle -->
  <circle cx="50" cy="50" r="4" fill="#FFD700"/>
  <circle cx="150" cy="45" r="3" fill="#FFD700"/>
  <circle cx="155" cy="140" r="3" fill="#FFD700"/>
</svg>
