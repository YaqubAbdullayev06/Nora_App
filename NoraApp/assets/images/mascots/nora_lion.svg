  <!-- Crown -->
  <polygon points="82,45 88,30 95,42 100,25 105,42 112,30 118,45" fill="#FFD700"/>
  <circle cx="88" cy="32" r="3" fill="#EF4444"/>
  <circle cx="100" cy="25" r="3" fill="#3B82F6"/>
