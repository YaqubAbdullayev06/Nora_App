<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#FEF9C3"/>
  <!-- Mane -->
  <circle cx="100" cy="85" r="52" fill="#F59E0B"/>
