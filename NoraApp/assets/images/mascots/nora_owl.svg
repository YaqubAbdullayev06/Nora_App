<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#FEF3C7"/>
  <!-- Body -->
  <ellipse cx="100" cy="105" rx="50" ry="55" fill="#F59E0B"/>
  <!-- Belly -->
  <ellipse cx="100" cy="115" rx="30" ry="35" fill="#FEF3C7"/>
  <!-- Head tufts (ears) -->
  <polygon points="55,55 70,35 80,60" fill="#D97706"/>
  <polygon points="145,55 130,35 120,60" fill="#D97706"/>
  <!-- Eyes (large owl eyes) -->
  <circle cx="80" cy="85" r="18" fill="#FFF"/>
  <circle cx="120" cy="85" r="18" fill="#FFF"/>
  <circle cx="80" cy="85" r="10" fill="#1E293B"/>
  <circle cx="120" cy="85" r="10" fill="#1E293B"/>
  <circle cx="83" cy="82" r="4" fill="#FFF"/>
  <circle cx="123" cy="82" r="4" fill="#FFF"/>
  <!-- Beak -->
  <polygon points="95,100 100,112 105,100" fill="#F97316"/>
  <!-- Eyebrows -->
  <path d="M62 68 Q80 60 97 68" stroke="#D97706" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M103 68 Q120 60 138 68" stroke="#D97706" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Wings -->
  <path d="M50 95 Q35 110 50 130" stroke="#D97706" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M150 95 Q165 110 150 130" stroke="#D97706" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Feet -->
  <path d="M80 155 L75 165 M85 155 L85 168 M90 155 L95 165" stroke="#F97316" stroke-width="3" stroke-linecap="round"/>
  <path d="M110 155 L105 165 M115 155 L115 168 M120 155 L125 165" stroke="#F97316" stroke-width="3" stroke-linecap="round"/>
  <!-- Graduation cap -->
  <rect x="70" y="45" width="60" height="5" rx="2" fill="#1E293B"/>
  <polygon points="100,30 70,48 100,55 130,48" fill="#1E293B"/>
  <line x1="130" y1="48" x2="135" y2="60" stroke="#FFD700" stroke-width="2"/>
  <circle cx="135" cy="62" r="4" fill="#FFD700"/>
</svg>
